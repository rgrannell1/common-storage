[project]
name = "cmstr"
version = "0.1.0"
description = "Python client for cmstr (common-storage v2)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "vulture>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmstr"]

[tool.ruff]
line-length = 130
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "BLE", "SIM", "RUF", "PLR", "PLC", "C"]

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 14

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.pytest.ini_options]
asyncio_mode = "auto"
